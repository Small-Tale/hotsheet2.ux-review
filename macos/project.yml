# XcodeGen spec for the macOS app. Generate the project with `scripts/macos-project.sh`
# (the .xcodeproj is a build artifact and is not committed).
name: UXReview
options:
  bundleIdPrefix: com.smalltale
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  UXReviewKit:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  UXReview:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: UXReviewKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: UX Review
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: Copyright © 2026 Small Tale Inc.
        # Finder "Open With" and drops on the app icon for images and movies (docs/04 §4.12.1).
        # Alternate rank: offered, never the default app for these files.
        # A review is a `.uxreview` package (HS2-BKWZ5N, docs/07 §7.9).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.smalltale.uxreview.review
            UTTypeDescription: UX Review
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [uxreview]
        CFBundleDocumentTypes:
          - CFBundleTypeName: UX Review
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes: [com.smalltale.uxreview.review]
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image]
          - CFBundleTypeName: Movie
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie]
        # `uxreview://capture?…` capture links (HS2-CWTNY2, docs/04 §4.13).
        CFBundleURLTypes:
          - CFBundleURLName: com.smalltale.uxreview.capture-link
            CFBundleURLSchemes: [uxreview]
        NSMicrophoneUsageDescription: UX Review records your voice as narration for screen recordings when you turn narration on.
    # The hardened runtime blocks the microphone without this entitlement (narration, docs/04 §4.9).
    entitlements:
      path: App/UXReview.entitlements
      properties:
        com.apple.security.device.audio-input: true
    # Signing comes from Signing.xcconfig (ad hoc unless Signing.local.xcconfig sets an identity).
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smalltale.uxreview
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
